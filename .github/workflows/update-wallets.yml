name: Update Wallet Data

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 UTC 01:00 (한국시간 10:00)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -f data/wallet_data.json ]; then
            echo "Existing data found. Running incremental update..."
            python collect_data.py --update
          else
            echo "No existing data. Running full collection..."
            python collect_data.py --full
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update wallet data $(date -u +%Y-%m-%d)"
          git push
